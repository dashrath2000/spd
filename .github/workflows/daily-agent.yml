name: Daily Autonomous Renovation Blog Agent

on:
  schedule:
    # Runs every day at 06:00 AM IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  run-blog-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/node-versions@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run SPD Renovation Blog Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/agent/index.js

      - name: Commit and Push New Published Blog & Sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "robot(blog): auto-published daily SEO renovation blog & updated sitemap [skip ci]"
          branch: main
